name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Panel, işletmelerin Windows bilgisayarında çalışır; testler de aynı ortamda koşar.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt ruff
      - name: Statik denetim (tanımsız isim, kullanılmayan import, sözdizimi)
        run: python -m ruff check --select F,E9 app.py src tests tools
      - name: Testler
        run: python -m pytest -q
